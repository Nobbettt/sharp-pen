name: Release skill

# Every merge to main that touches the skill becomes a release: the patch
# number of the last v* tag is bumped, the skill is zipped, and a GitHub
# release is created with standalone-skill and plugin archives.
#
# Claude Code plugin users do not depend on this: its compatibility manifest
# has no version field, so they update on every new commit SHA.

on:
  push:
    branches: [main]
    paths: ['sharp-pen/**', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags are needed to compute the next version

      - name: Next version
        id: version
        run: |
          latest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$latest" ]; then
            next=v0.1.0
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "Releasing $next (previous: ${latest:-none})"

      # The skill lives at sharp-pen/skills/review/ so the plugin command is
      # /sharp-pen:review. The zip renames that folder back to sharp-pen/ and
      # leaves out the plugin manifest, which a skill upload rejects.
      - name: Zip skill
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir stage
          cp -R sharp-pen/skills/review stage/sharp-pen
          (cd stage && zip -r "../sharp-pen-${TAG}.zip" sharp-pen -x '*.DS_Store')
          # Same archive under a fixed name, so releases/latest/download/sharp-pen-latest.zip
          # always resolves to the newest release.
          cp "sharp-pen-${TAG}.zip" sharp-pen-latest.zip

      - name: Zip plugin
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir plugin-stage
          cp -R sharp-pen plugin-stage/sharp-pen
          jq --arg version "${TAG#v}" '.version = $version' \
            plugin-stage/sharp-pen/plugin.json > plugin-stage/plugin.json
          mv plugin-stage/plugin.json plugin-stage/sharp-pen/plugin.json
          (cd plugin-stage && zip -r "../sharp-pen-plugin-${TAG}.zip" sharp-pen -x '*.DS_Store')
          cp "sharp-pen-plugin-${TAG}.zip" sharp-pen-plugin-latest.zip

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" "sharp-pen-${TAG}.zip" sharp-pen-latest.zip \
            "sharp-pen-plugin-${TAG}.zip" sharp-pen-plugin-latest.zip \
            --target "$GITHUB_SHA" --title "$TAG" --generate-notes
