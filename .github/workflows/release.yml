name: Package skill

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip skill
        run: zip -r "sharp-pen-${GITHUB_REF_NAME}.zip" sharp-pen -x '*.DS_Store'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sharp-pen-${{ github.ref_name }}
          path: sharp-pen-${{ github.ref_name }}.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "sharp-pen-${GITHUB_REF_NAME}.zip" --title "${GITHUB_REF_NAME}" --generate-notes
