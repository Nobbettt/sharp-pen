name: Release VS Code extension

on:
  push:
    tags: ["extension-v*"]

concurrency:
  group: vscode-extension-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Check version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          [ "$TAG" = "extension-v$version" ] || { echo "$TAG does not match package version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "VSIX=sharp-pen-$version.vsix" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm test
      - run: npm run package -- --out "$VSIX"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix
          path: vscode-extension/${{ env.VSIX }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix
          path: vscode-extension

      - name: Check version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          [ "$TAG" = "extension-v$version" ] || { echo "$TAG does not match package version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "VSIX=sharp-pen-$version.vsix" >> "$GITHUB_ENV"

      # Installs the lockfile-pinned @vscode/vsce so `npx` below never fetches an
      # unpinned publisher package in a job holding release credentials.
      - run: npm ci --ignore-scripts

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath "$VSIX" --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" "$VSIX" --title "sharp-pen VS Code $VERSION" --notes "VS Code extension $VERSION."
